
name: Build NEET Buddy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEET_Buddy_Android_Project/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: NEET_Buddy_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEET-Buddy-debug-apk
          path: NEET_Buddy_Android_Project/app/build/outputs/apk/debug/app-debug.apk
